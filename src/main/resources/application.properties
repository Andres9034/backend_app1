# ============================================================
# application.properties
# Para qué sirve: aquí se configura el servidor, la base de datos
# y JPA. Spring Boot lee este archivo al arrancar.
# ============================================================

# Nombre interno de la aplicación (sale en logs).
spring.application.name=articulos-oficina-api

# Puerto HTTP del backend. El frontend llama a http://localhost:8080
server.port=8080

# ------------------------------------------------------------
# Base de datos H2 (archivo en disco, no hace falta instalar MySQL).
# jdbc:h2:file:./data/articulos-db  → crea una carpeta "data" junto al backend.
# Más adelante, en CentOS, se puede cambiar a MySQL sin tocar el CRUD.
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/articulos-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas según las entidades Java.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 para ver las tablas en el navegador.
# Entrar a: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/articulos-db
# Usuario: sa   Contraseña: (vacía)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permite abrir la consola aunque se use desde otro origen.
spring.h2.console.settings.web-allow-others=true
